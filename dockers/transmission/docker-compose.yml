services:
  transmission:
    image: lscr.io/linuxserver/transmission
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - TRANSMISSION_WEB_HOME=/combustion-release/ #optional
      - USER=${TRANSMISSION_USER:-admin}
      - PASS=${TRANSMISSION_PASS:?TRANSMISSION_PASS must be set}
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ./watch:/watch
    ports:
      - "${TRANSMISSION_WEB_BIND_ADDRESS:-127.0.0.1}:9091:9091"
      - "${TRANSMISSION_PEER_BIND_ADDRESS:-127.0.0.1}:51413:51413"
      - "${TRANSMISSION_PEER_BIND_ADDRESS:-127.0.0.1}:51413:51413/udp"
    restart: unless-stopped
