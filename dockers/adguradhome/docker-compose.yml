version: '3.7'
services:
  adguardhome:  # 服务名称
    container_name: adguardhome  # 容器名称
    image: adguard/adguardhome:latest
    restart: always
    # network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - "./conf:/opt/adguardhome/conf"
      - "./data:/opt/adguardhome/work/data"
    ports:
      - "${ADGUARD_BIND_ADDRESS:-127.0.0.1}:53:53/tcp"
      - "${ADGUARD_BIND_ADDRESS:-127.0.0.1}:53:53/udp"
      - "${ADGUARD_BIND_ADDRESS:-127.0.0.1}:84:80/tcp"
      - "${ADGUARD_BIND_ADDRESS:-127.0.0.1}:3000:3000/tcp"
      - "${ADGUARD_BIND_ADDRESS:-127.0.0.1}:67:67/udp"
      - "${ADGUARD_BIND_ADDRESS:-127.0.0.1}:68:68/tcp"
      - "${ADGUARD_BIND_ADDRESS:-127.0.0.1}:68:68/udp"
      - "${ADGUARD_BIND_ADDRESS:-127.0.0.1}:444:443/tcp"
      - "${ADGUARD_BIND_ADDRESS:-127.0.0.1}:853:853/tcp"
