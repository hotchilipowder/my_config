version: "3"
services:
  rathole-server:
      image: my-rathole
      build:
        context: .
      network_mode: host
      environment:
          RATHOLE_TOKEN: ${RATHOLE_TOKEN:?RATHOLE_TOKEN must be set}
      volumes:
          - ./server.toml.example:/etc/rathole/server.toml.template:ro
      restart: unless-stopped
      tty: true
